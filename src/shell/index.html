<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>BitPortal</title>
<meta name="description" content="BitPortal, with the screen kept filled as you walk from world to world.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/mark/mark-tile-180.png">
<link rel="stylesheet" href="/bitportal.css">
</head>
<body class="shell">
<!-- The room, the Airlock and each world are shown here, one after another, and this page never changes: so a
     filled screen isn't given up at a door. The frame is not given the screen to fill: this page holds it, and
     fills it when the place in the frame asks, at the visitor's press. A microphone and a headset are handed on
     to whatever is in the frame: said with a star, because a name here would be the first place shown and no
     other, and the frame goes from place to place. Which places those can be is this page's own rules' to say
     (scripts/build.mjs): itself and the worlds named there, and nowhere else. -->
<iframe id="view" class="shell-view" title="Where you are" allow="xr-spatial-tracking *; microphone *; autoplay *; gamepad *; clipboard-write *; fullscreen 'none'"></iframe>
<noscript><p class="shell-lede"><a href="/walk/?plain=1">Walk in</a></p></noscript>
<script type="module" src="/shell/main.js"></script>
</body>
</html>
